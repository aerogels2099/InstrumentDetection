<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instrument Detection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            text-align: center;
        }
        input[type="file"] {
            margin: 20px 0;
        }
        #results {
            margin-top: 30px;
            text-align: left;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Instrument Detection</h1>
    <p>Upload a WAV or MP3 file to detect instruments in the song.</p>

    <input type="file" id="fileInput" accept=".wav,.mp3,.flac,.ogg,.m4a">
    <button onclick="uploadFile()">Detect Instruments</button>

    <div id="results"></div>

    <script>
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];

            if (!file) {
                alert("Please select a WAV file first.");
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = "<p>Detecting instruments...</p>";

            try {
                const response = await fetch('http://127.0.0.1:8000/api/predict', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    resultsDiv.innerHTML = `<p style="color:red;">Error: ${errorData.error}</p>`;
                    return;
                }

                const data = await response.json();

                let html = "<h3>Detected Instruments:</h3>";
                if (data.detected_instruments.length === 0) {
                    html += "<p>None detected.</p>";
                } else {
                    html += `<p>${data.detected_instruments.join(', ')}</p>`;
                }

                html += "<h3>Scores:</h3>";
                html += "<table><tr><th>Instrument</th><th>Score</th></tr>";
                for (const [inst, score] of Object.entries(data.scores)) {
                    html += `<tr><td>${inst}</td><td>${score}</td></tr>`;
                }
                html += "</table>";

                resultsDiv.innerHTML = html;

            } catch (err) {
                resultsDiv.innerHTML = `<p style="color:red;">Error: ${err.message}</p>`;
            }
        }
    </script>
</body>
</html>
